name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verificaciones
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # El valor por defecto de v3 incluye `tools`, retirado del SDK.
          packages: platform-tools

      - name: Configurar Firebase ficticio
        run: cp .github/ci/google-services.json app/google-services.json

      - name: Comprobar el script de pruebas Android
        run: python3 -B -m unittest discover -s .github/ci -p 'test_*.py' -v

      - name: Compilar, ejecutar pruebas unitarias y Lint
        id: gradle
        run: ./gradlew --no-daemon --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest

      - name: Preparar Node para Firebase
        if: hashFiles('firebase-tests/package.json') != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar dependencias de las pruebas Firebase
        if: hashFiles('firebase-tests/package.json') != ''
        run: npm --prefix firebase-tests ci

      - name: Probar reglas Firebase
        id: firebase
        if: hashFiles('firebase-tests/package.json') != ''
        run: npm --prefix firebase-tests test

      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar pruebas instrumentadas en API 29
        id: android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/ci/android-tests.sh

      - name: Resumir verificaciones
        if: always()
        env:
          GRADLE_RESULT: ${{ steps.gradle.outcome }}
          FIREBASE_RESULT: ${{ steps.firebase.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
        run: |
          {
            echo '## CI'
            echo "- Compilación, pruebas unitarias y Lint: $GRADLE_RESULT"
            echo "- Reglas Firebase: $FIREBASE_RESULT"
            echo "- Pruebas instrumentadas (API 29): $ANDROID_RESULT"
            if [[ ! -f firebase-tests/package.json ]]; then
              echo '- Esta revisión todavía no incluye la suite Firebase; solo se ejecutan las pruebas Android presentes.'
            fi
            echo '- Los detalles están en los logs; no se publican APK ni informes descargables.'
          } >> "$GITHUB_STEP_SUMMARY"
